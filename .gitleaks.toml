[extend]
useDefault = true

[allowlist]
description = "False positives from nutrient-key identifiers, and Firebase Web SDK config that is public by design (STANDARDS.md section 8.5 — real security lives in firestore.rules, not these values)"
regexes = [
  '''vitaminB12_mcg''',
]
paths = [
  '''src/environments/environment\.ts''',
  '''src/environments/environment\.prod\.ts''',
]
