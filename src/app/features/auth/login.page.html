<dt-logo class="auth-logo" />

<mat-card class="auth-card">
  <mat-card-header>
    <mat-card-title>Connexion</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <form (submit)="$event.preventDefault(); onSubmit()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          name="email"
          autocomplete="email"
          required
          [value]="email()"
          (input)="onEmailInput($event)"
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Mot de passe</mat-label>
        <input
          matInput
          type="password"
          name="password"
          autocomplete="current-password"
          required
          [value]="password()"
          (input)="onPasswordInput($event)"
        />
      </mat-form-field>

      @if (errorMessage()) {
        <p class="error" role="alert">{{ errorMessage() }}</p>
      }

      <button mat-flat-button type="submit" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <mat-spinner diameter="20" />
        } @else {
          Se connecter
        }
      </button>

      <a routerLink="/register">Créer un compte</a>
    </form>

    <div class="social-divider"><span>ou</span></div>

    <div class="social-buttons">
      <button
        mat-stroked-button
        type="button"
        [disabled]="isSubmitting()"
        (click)="onGoogleSignIn()"
      >
        <span class="social-button-content">
          <svg class="social-icon" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
            <path
              fill="#4285F4"
              d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"
            />
            <path
              fill="#34A853"
              d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"
            />
            <path
              fill="#FBBC05"
              d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z"
            />
            <path
              fill="#EA4335"
              d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"
            />
          </svg>
          Continuer avec Google
        </span>
      </button>
      <button
        mat-stroked-button
        type="button"
        [disabled]="isSubmitting()"
        (click)="onFacebookSignIn()"
      >
        <span class="social-button-content">
          <svg
            class="social-icon"
            viewBox="0 0 24 24"
            fill="#1877F2"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
            />
          </svg>
          Continuer avec Facebook
        </span>
      </button>
    </div>
  </mat-card-content>
</mat-card>
