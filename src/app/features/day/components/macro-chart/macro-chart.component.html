<div class="chart-container">
  <ngx-charts-bar-vertical
    [view]="[350, 250]"
    [results]="series()"
    [scheme]="scheme"
    [xAxis]="true"
    [yAxis]="true"
    [showYAxisLabel]="true"
    yAxisLabel="% des kcal totaux"
    [showDataLabel]="true"
    [roundEdges]="false"
    [animations]="false"
  />
</div>
