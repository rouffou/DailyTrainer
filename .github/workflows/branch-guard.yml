name: Branch Guard

on:
  pull_request:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Only allow develop to merge into main
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::Merges into main are only allowed from develop (got '${{ github.head_ref }}'). Merge into develop first."
            exit 1
          fi
